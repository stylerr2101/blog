{% extends "base.html" %}



{% block title %}
Регистрация | Git
{% endblock %}




{% block content %}



<style>
    .auth-wrapper {

        display: flex;

        justify-content: center;

    }



    .auth-card {

        width: 450px;

        background: white;

        padding: 40px;

        border-radius: 25px;

        box-shadow:
            0 15px 40px rgba(0, 0, 0, .08);

    }



    .auth-card h1 {

        text-align: center;

        font-size: 32px;

    }



    .subtitle {

        text-align: center;

        color: #6b7280;

        margin-bottom: 30px;

    }



    input {

        width: 100%;

        padding: 15px;

        margin-bottom: 18px;

        border-radius: 14px;

        border: 1px solid #e5e7eb;

    }



    input:focus {

        outline: none;

        border-color: #2563eb;

    }



    button {

        width: 100%;

        padding: 15px;

        background: #2563eb;

        color: white;

        border: none;

        border-radius: 14px;

        font-weight: 700;

        cursor: pointer;

    }



    button:hover {

        background: #1d4ed8;

    }



    .login-link {

        text-align: center;

        margin-top: 20px;

    }



    .login-link a {

        color: #2563eb;

        font-weight: 700;

    }
</style>
<div class="auth-wrapper">
    <div class="auth-card">
        <h1>
             Регистрация
        </h1>
        <p class="subtitle">
            Создай аккаунт Git
        </p>
        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Логин" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Пароль" required>
            <button>
                Создать аккаунт
            </button>
        </form>
        <div class="login-link">
            Уже есть аккаунт?
            <a href="{% url 'login' %}">
                Войти
            </a>
        </div>
    </div>
</div>
{% endblock %}
