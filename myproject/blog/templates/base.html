{% load static %}

<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        Git
        {% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        /* HEADER */

        header {

            height: 75px;

            background: white;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 60px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);

            position: sticky;

            top: 0;

            z-index: 100;

        }



        .logo {

            font-size: 30px;

            font-weight: 900;

            color: #2563eb;

            letter-spacing: -1px;

        }



        nav {

            display: flex;

            align-items: center;

            gap: 25px;

        }



        nav a {

            color: #4b5563;

            font-weight: 600;

            transition: .2s;

        }



        nav a:hover {

            color: #2563eb;

        }



        .create-btn {

            background: #2563eb;

            color: white !important;

            padding: 12px 20px;

            border-radius: 12px;

        }



        .create-btn:hover {

            background: #1d4ed8;

        }



        .user {

            background: #eff6ff;

            color: #2563eb;

            padding: 10px 15px;

            border-radius: 12px;

            font-weight: 600;

        }



        /* MAIN */


        main {

            width: 1200px;

            max-width: 90%;

            margin: 40px auto;

        }



        /* CARDS */


        .card {

            background: white;

            border-radius: 20px;

            padding: 25px;

            box-shadow:

                0 10px 30px rgba(0, 0, 0, .07);

        }



        /* BUTTON */


        .btn {

            border: none;

            cursor: pointer;

            padding: 13px 25px;

            border-radius: 12px;

            font-weight: 700;

            font-size: 15px;

        }


        .btn-primary {

            background: #2563eb;

            color: white;

        }


        .btn-primary:hover {

            background: #1d4ed8;

        }



        /* FORM */


        input,
        textarea,
        select {

            width: 100%;

            padding: 14px;

            border: 1px solid #e5e7eb;

            border-radius: 12px;

            font-size: 15px;

            margin-bottom: 15px;

        }


        input:focus,
        textarea:focus,
        select:focus {

            outline: none;

            border-color: #2563eb;

        }



        /* FOOTER */


        footer {

            margin-top: 60px;

            padding: 30px;

            text-align: center;

            color: #6b7280;

        }



        /* MOBILE */


        @media(max-width:800px) {


            header {

                padding: 0 20px;

            }


            nav {

                display: none;

            }


            main {

                max-width: 95%;

            }

        }
    </style>

</head>

<body>
    <header>
        <a href="{% url 'home' %}" class="logo">
            Git
        </a>
        <nav>
            <a href="{% url 'home' %}">
                 Главная
            </a>
            {% if user.is_authenticated %}
            <a href="{% url 'create_post' %}" class="create-btn">
                 Создать пост
            </a>
            <a href="{% url 'drafts' %}">
                 Черновики
            </a>
            <a href="{% url 'profile' %}">
                 Профиль
            </a>
            <a href="{% url 'logout' %}">
                 Выйти
            </a>
            {% else %}
            <a href="{% url 'login' %}">
                Войти
            </a>
            <a href="{% url 'register' %}">
                Регистрация
            </a>
            {% endif %}
        </nav>
    </header>
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        © 2026 Git • Дружеское cообщество 
    </footer>
</body>
</html>
