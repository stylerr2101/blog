{% extends "base.html" %}


{% block title %}
Создать пост | Git
{% endblock %}



{% block content %}


<style>
    .create-wrapper {

        display: flex;

        justify-content: center;

    }



    .create-card {

        background: white;

        width: 650px;

        padding: 40px;

        border-radius: 25px;

        box-shadow:
            0 15px 40px rgba(0, 0, 0, .08);

    }



    .create-card h1 {

        margin-top: 0;

        font-size: 32px;

    }



    .subtitle {

        color: #6b7280;

        margin-bottom: 30px;

    }



    label {

        display: block;

        font-weight: 700;

        margin-bottom: 8px;

    }



    input,
    textarea,
    select {

        width: 100%;

        padding: 15px;

        border-radius: 14px;

        border: 1px solid #e5e7eb;

        margin-bottom: 20px;

        font-size: 15px;

    }



    textarea {

        height: 180px;

        resize: none;

    }



    input:focus,
    textarea:focus,
    select:focus {

        outline: none;

        border-color: #2563eb;

    }



    .file {

        padding: 12px;

        background: #f3f4f6;

        border-radius: 12px;

    }



    .publish-btn {

        width: 100%;

        padding: 15px;

        background: #2563eb;

        color: white;

        border: none;

        border-radius: 14px;

        font-size: 17px;

        font-weight: 700;

        cursor: pointer;

        transition: .2s;

    }



    .publish-btn:hover {

        background: #1d4ed8;

        transform: translateY(-2px);

    }



    .error {

        background: #fee2e2;

        color: #991b1b;

        padding: 15px;

        border-radius: 12px;

        margin-bottom: 20px;

    }
</style>

<div class="create-wrapper">
    <div class="create-card">
        <h1>
             Создать пост
        </h1>
        <p class="subtitle">
            Поделись своей статьей с сообществом Git
        </p>
        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label>
                Название
            </label>
            <input type="text" name="name" placeholder="Например: Мое путешествие в Китай">
            <label>
                Описание
            </label>
            <textarea name="description" placeholder="Расскажи подробнее..."></textarea>
            <label>
                Категория
            </label>
            <select name="category">
                {% for category in categories %}
                <option value="{{ category.id }}">
                    {{ category.name }}
                </option>
                {% endfor %}
            </select>
            <label>
                Изображение
            </label>
            <input type="file" name="img" class="file">
            <label>
                Статус
            </label>
            <select name="status">
                <option value="published">
                    Опубликовать
                </option>
                <option value="draft">
                    Сохранить как черновик
                </option>
            </select>
            <button class="publish-btn">
                 Создать пост
            </button>
        </form>
    </div>
</div>
{% endblock %}
